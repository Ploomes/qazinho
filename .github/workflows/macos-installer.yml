name: macOS installer

# Um workflow próprio, para um runner Mac, cobrado a dez vezes um Linux, rodar só para o .dmg.
# A release o chama assim que cria a tag; dispará-lo constrói os instaladores de uma release que existe.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: The release to build the macOS installers of, such as v0.1.0
        type: string
        required: true
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

jobs:
  dmg:
    name: macOS installer
    runs-on: macos-latest
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag }}
      RELEASES_REPO: Salve-Software/qazinho-releases
      # O electron-builder baixa o Electron que empacota para cada arquitetura.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - name: Check the Apple credentials
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          missing=''
          for name in APPLE_CERTIFICATE_P12 APPLE_CERTIFICATE_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER RELEASES_TOKEN; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing. An unsigned .dmg reads as damaged on the QA's Mac, so none is built."
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.GH_QAZINHO_TOKEN }}
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # O electron-builder assina com o certificado Developer ID (o CSC_LINK o recebe em base64) e
      # notariza com a chave de API do App Store Connect, que ele lê de um arquivo.
      - name: Package, sign and notarize
        env:
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY"
          npx electron-builder --mac --arm64 --x64 --publish never

      # O zip e o latest-mac.yml são o que atualiza um app instalado; o dmg é só a primeira instalação.
      # O feed sobe por último: um app nunca lê uma versão cujos arquivos ainda não chegaram.
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          gh release view "$TAG" --repo "$RELEASES_REPO" > /dev/null 2>&1 ||
            gh release create "$TAG" --repo "$RELEASES_REPO" --title "$TAG" --notes "QAzinho $TAG" ||
            true
          gh release upload "$TAG" release/*.dmg release/*.zip release/*.blockmap --clobber --repo "$RELEASES_REPO"
          gh release upload "$TAG" release/latest-mac.yml --clobber --repo "$RELEASES_REPO"
