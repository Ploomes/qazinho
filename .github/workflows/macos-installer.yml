name: macOS installer

# Its own workflow, so a Mac runner, billed at ten times a Linux one, runs only for the .dmg.
# The release calls it once it tags; dispatching it builds the installers of a release that exists.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: The release to build the macOS installers of, such as v0.1.0
        type: string
        required: true
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

jobs:
  dmg:
    name: macOS installer
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag }}
      # electron-builder fetches the Electron it packs for each architecture.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - name: Check the Apple credentials
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          missing=''
          for name in APPLE_CERTIFICATE_P12 APPLE_CERTIFICATE_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing. An unsigned .dmg reads as damaged on the QA's Mac, so none is built."
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # electron-builder signs with the Developer ID certificate (CSC_LINK takes it as base64) and
      # notarizes with the App Store Connect API key, which it reads from a file.
      - name: Package, sign and notarize
        env:
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY"
          npx electron-builder --mac --arm64 --x64 --publish never

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" release/*.dmg --clobber --repo "$GITHUB_REPOSITORY"
