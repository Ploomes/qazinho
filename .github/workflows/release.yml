name: Release

# Só manual. Lançar uma versão é uma decisão, não um efeito colateral do merge.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Work out the next version and stop, without tagging or releasing
        type: boolean
        default: false
      tag:
        description: Release nothing new; only build the installers of this existing release, such as v0.1.0
        type: string
        default: ''
      mac:
        description: Build the macOS installers too, on a Mac runner billed at ten times a Linux one
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    if: inputs.tag == ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      tag: ${{ steps.released.outputs.tag }}
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.GH_QAZINHO_TOKEN }}
          # O semantic-release precisa do histórico inteiro para achar a última tag.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Um dispatch pode mirar qualquer ref, então o CI ter rodado no commit não basta.
      - name: Verify
        run: |
          npm run lint
          npm run typecheck
          npm run format:check
          npm test
          npm run build

      - name: Semantic release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release ${{ inputs.dry_run && '--dry-run' || '' }}

      # O semantic-release cria a tag no commit de release que faz; um dry run, ou nada a lançar, não cria nenhuma.
      - name: Released tag
        id: released
        run: echo "tag=$(git tag --points-at HEAD --list 'v*' | head -n 1)" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows installer
    needs: release
    # Uma release criada com o GITHUB_TOKEN não inicia outro workflow, então o instalador é construído aqui.
    if: ${{ !cancelled() && !failure() && (inputs.tag != '' || needs.release.outputs.tag != '') }}
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag != '' && inputs.tag || needs.release.outputs.tag }}
      # O electron-builder baixa o Electron de Windows que empacota; o do próprio npm ficaria sem uso.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.GH_QAZINHO_TOKEN }}
          ref: ${{ env.TAG }}
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # Ainda sem certificado: o instalador sai sem assinatura, e o SmartScreen pergunta uma vez.
      - name: Package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win --x64 --publish never

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" release/*.exe --clobber --repo "$GITHUB_REPOSITORY"

  mac:
    name: macOS installer
    needs: release
    if: ${{ !cancelled() && !failure() && inputs.mac && (inputs.tag != '' || needs.release.outputs.tag != '') }}
    permissions:
      contents: write
    uses: ./.github/workflows/macos-installer.yml
    with:
      tag: ${{ inputs.tag != '' && inputs.tag || needs.release.outputs.tag }}
    secrets: inherit
