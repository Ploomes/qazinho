name: Release

# Manual only. Releasing is a decision, not a side effect of merging.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Work out the next version and stop, without tagging or releasing
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          # semantic-release needs the full history to find the last tag.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A dispatch can target any ref, so CI having run on the commit is not enough.
      - name: Verify
        run: |
          npm run lint
          npm run typecheck
          npm run format:check
          npm test
          npm run build

      - name: Semantic release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release ${{ inputs.dry_run && '--dry-run' || '' }}
