name: Release

# Só manual. Lançar uma versão é uma decisão, não um efeito colateral do merge.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Work out the next version and stop, without tagging or releasing
        type: boolean
        default: false
      tag:
        description: Release nothing new; only build the installers of this existing release, such as v0.1.0
        type: string
        default: ''
      mac:
        description: Build the macOS installers too, on a Mac runner billed at ten times a Linux one
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    if: inputs.tag == ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      tag: ${{ steps.released.outputs.tag }}
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.GH_QAZINHO_TOKEN }}
          # O semantic-release precisa do histórico inteiro para achar a última tag.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Um dispatch pode mirar qualquer ref, então o CI ter rodado no commit não basta.
      - name: Verify
        run: |
          npm run lint
          npm run typecheck
          npm run format:check
          npm test
          npm run build

      - name: Semantic release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release ${{ inputs.dry_run && '--dry-run' || '' }}

      # O semantic-release cria a tag no commit de release que faz; um dry run, ou nada a lançar, não cria nenhuma.
      - name: Released tag
        id: released
        run: echo "tag=$(git tag --points-at HEAD --list 'v*' | head -n 1)" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows installer
    needs: release
    # Uma release criada com o GITHUB_TOKEN não inicia outro workflow, então o instalador é construído aqui.
    if: ${{ !cancelled() && !failure() && (inputs.tag != '' || needs.release.outputs.tag != '') }}
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag != '' && inputs.tag || needs.release.outputs.tag }}
      RELEASES_REPO: Salve-Software/qazinho-releases
      # O electron-builder baixa o Electron de Windows que empacota; o do próprio npm ficaria sem uso.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    defaults:
      run:
        shell: bash
    steps:
      - name: Check the releases token
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [ -z "$RELEASES_TOKEN" ]; then
            echo "::error::Missing the RELEASES_TOKEN secret, which writes to $RELEASES_REPO."
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.GH_QAZINHO_TOKEN }}
          ref: ${{ env.TAG }}
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # Ainda sem certificado: o instalador sai sem assinatura, e o SmartScreen pergunta uma vez.
      - name: Package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win --x64 --publish never

      # O código é privado, então o que instala e atualiza o app mora em outro repositório. Cada
      # job cria a release se ainda não existe; dois ao mesmo tempo não atrapalham o upload. O
      # feed sobe por último: um app nunca lê uma versão cujos arquivos ainda não chegaram.
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          gh release view "$TAG" --repo "$RELEASES_REPO" > /dev/null 2>&1 ||
            gh release create "$TAG" --repo "$RELEASES_REPO" --title "$TAG" --notes "QAzinho $TAG" ||
            true
          gh release upload "$TAG" release/*.exe release/*.exe.blockmap --clobber --repo "$RELEASES_REPO"
          gh release upload "$TAG" release/latest.yml --clobber --repo "$RELEASES_REPO"

      # A Microsoft Store assina o pacote dela depois de aprová-lo, então ele sai sem assinatura e
      # nunca vai ao repositório público, onde nada o instalaria: fica na release do código, de onde
      # é enviado ao Partner Center.
      - name: Package for the Microsoft Store
        run: npx electron-builder --win appx --x64 --publish never

      - name: Keep the Store package
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" release/*.appx --clobber --repo "${{ github.repository }}"

  linux:
    name: Linux installer
    needs: release
    if: ${{ !cancelled() && !failure() && (inputs.tag != '' || needs.release.outputs.tag != '') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag != '' && inputs.tag || needs.release.outputs.tag }}
      RELEASES_REPO: Salve-Software/qazinho-releases
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - name: Check the releases token
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [ -z "$RELEASES_TOKEN" ]; then
            echo "::error::Missing the RELEASES_TOKEN secret, which writes to $RELEASES_REPO."
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.GH_QAZINHO_TOKEN }}
          ref: ${{ env.TAG }}
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Package
        run: npx electron-builder --linux AppImage --x64 --publish never

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          gh release view "$TAG" --repo "$RELEASES_REPO" > /dev/null 2>&1 ||
            gh release create "$TAG" --repo "$RELEASES_REPO" --title "$TAG" --notes "QAzinho $TAG" ||
            true
          gh release upload "$TAG" release/*.AppImage --clobber --repo "$RELEASES_REPO"
          gh release upload "$TAG" release/latest-linux.yml --clobber --repo "$RELEASES_REPO"

  mac:
    name: macOS installer
    needs: release
    if: ${{ !cancelled() && !failure() && inputs.mac && (inputs.tag != '' || needs.release.outputs.tag != '') }}
    permissions:
      contents: read
    uses: ./.github/workflows/macos-installer.yml
    with:
      tag: ${{ inputs.tag != '' && inputs.tag || needs.release.outputs.tag }}
    secrets: inherit
