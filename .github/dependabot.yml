version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope

    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

    # Estas majors são seguradas de propósito, veja .claude/rules/tooling.md: o electron-vite 5
    # aceita o Vite até o 7, e o typescript-eslint aceita o TypeScript abaixo do 6.1.
    ignore:
      - dependency-name: vite
        update-types: ['version-update:semver-major']
      - dependency-name: '@vitejs/plugin-react'
        update-types: ['version-update:semver-major']
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
