version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope

    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

    # These majors are held back on purpose, see .claude/rules/tooling.md: electron-vite 5
    # accepts Vite up to 7, and typescript-eslint accepts TypeScript below 6.1.
    ignore:
      - dependency-name: vite
        update-types: ['version-update:semver-major']
      - dependency-name: '@vitejs/plugin-react'
        update-types: ['version-update:semver-major']
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
