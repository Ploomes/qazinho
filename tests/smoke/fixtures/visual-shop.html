<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Loja Fake · Tênis Corrida Pro</title>
    <style>
      body {
        margin: 0;
        font:
          16px/1.5 system-ui,
          sans-serif;
        color: #1d1d1f;
        background: #fff;
      }
      header {
        display: flex;
        justify-content: space-between;
        padding: 16px 32px;
        border-bottom: 1px solid #eee;
      }
      main {
        display: flex;
        gap: 48px;
        padding: 40px 32px;
      }
      .photo {
        width: 360px;
        height: 360px;
        border: 1px solid #eee;
      }
      .info {
        position: relative;
        width: 420px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 28px;
      }
      .price {
        font-size: 32px;
        font-weight: 700;
        color: #0a7d32;
        margin: 0 0 8px;
      }
      .buy {
        position: absolute;
        top: 46px;
        left: 0;
        width: 300px;
        height: 64px;
        background: #ff5a1f;
        color: #fff;
        border: none;
        font-size: 18px;
        font-weight: 700;
        border-radius: 8px;
      }
      .shipping {
        color: #ffffff;
        background: #ffffff;
        margin: 64px 0 24px;
      }
      .add {
        padding: 12px 20px;
        font-size: 16px;
        border-radius: 8px;
        border: 1px solid #1d1d1f;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <header><strong>Loja Fake</strong><span id="cart">Carrinho (0)</span></header>
    <main>
      <img
        class="photo"
        src="/fotos/tenis-corrida-pro.jpg"
        alt="Foto do Tênis Corrida Pro"
      />
      <div class="info">
        <h1>Tênis Corrida Pro</h1>
        <p class="price">R$ 199,90</p>
        <button class="buy">Comprar agora</button>
        <p class="shipping">Frete grátis para todo o Brasil</p>
        <button
          class="add"
          onclick="document.getElementById('cart').textContent = 'Carrinho (1)'"
        >
          Adicionar ao carrinho
        </button>
      </div>
    </main>
  </body>
</html>
