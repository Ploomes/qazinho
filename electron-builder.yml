appId: com.ploomes.qazinho
productName: QAzinho
protocols:
  - name: QAzinho
    schemes:
      - qazinho
directories:
  output: release
  buildResources: build
publish:
  provider: github
  owner: Ploomes
  repo: qazinho
  releaseType: release
files:
  - out/**/*
  - package.json
mac:
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
  hardenedRuntime: true
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
win:
  target: nsis
appx:
  applicationId: QAzinho
  displayName: QAzinho
  publisherDisplayName: Ploomes
  backgroundColor: '#0A0906'
  languages:
    - pt-BR
    - en-US
  minVersion: 10.0.17763.0
  capabilities:
    - unvirtualizedResources
  customManifestPath: appxmanifest.xml
  artifactName: ${productName}-${version}-${arch}.${ext}
nsis:
  guid: 88bc01ff-4150-5ea6-a5f0-2d7bad89aaa4
  artifactName: ${productName}-Setup-${version}.${ext}
linux:
  target: AppImage
  category: Development
  executableName: qazinho
  syncDesktopName: true
