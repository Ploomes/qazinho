appId: com.salvesoftware.qazinho
productName: QAzinho
protocols:
  - name: QAzinho
    schemes:
      - qazinho
directories:
  output: release
  buildResources: build
publish:
  provider: github
  owner: Salve-Software
  repo: qazinho-releases
  releaseType: release
files:
  - out/**/*
  - package.json
mac:
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
  hardenedRuntime: true
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
win:
  target: nsis
nsis:
  artifactName: ${productName}-Setup-${version}.${ext}
linux:
  target: AppImage
  category: Development
  executableName: qazinho
  syncDesktopName: true
